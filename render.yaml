services:
  - type: web
    name: telegram-media-bot
    runtime: docker
    plan: starter          # free plan works for testing but sleeps; starter+ recommended for ffmpeg
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      # optional speed tuning
      - key: X264_PRESET
        value: ultrafast        # fastest (default)
      - key: X264_CRF
        value: "26"
      - key: PORTRAIT_RES
        value: 720x1280         # use 1080x1920 for full HD (slower)
